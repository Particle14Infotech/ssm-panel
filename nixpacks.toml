[phases.setup]
nixPkgs = ["nodejs_22", "pnpm-9_x"]

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @smm/contracts build",
  "pnpm exec prisma generate",
  "pnpm --filter @smm/api build"
]

[start]
cmd = "pnpm exec prisma db push && pnpm --filter @smm/api start:prod"

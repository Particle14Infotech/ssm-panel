services:
  # -------------------------------------------------------------
  # 1. NestJS Backend API
  # -------------------------------------------------------------
  - type: web
    name: smm-api
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && node scripts/build-service.js
    startCommand: node scripts/start-service.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: SERVICE_NAME
        value: smm
      - key: DATABASE_URL
        fromDatabase:
          name: smm-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: PROVIDER_KEY_SECRET
        generateValue: true
      - key: PROVIDER_KEY_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@smmpanel.com
      - key: ADMIN_PASSWORD
        generateValue: true

  # -------------------------------------------------------------
  # 2. Next.js Frontend Web
  # -------------------------------------------------------------
  - type: web
    name: smm-web
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && node scripts/build-service.js
    startCommand: node scripts/start-service.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SERVICE_NAME
        value: web
      - key: NEXT_PUBLIC_SITE_NAME
        value: "SMM Panel"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: smm-api
          property: host

  # -------------------------------------------------------------
  # 3. Background Order / Status Worker
  # -------------------------------------------------------------
  - type: worker
    name: smm-worker
    runtime: node
    plan: starter
    buildCommand: pnpm install --no-frozen-lockfile && node scripts/build-service.js
    startCommand: node scripts/start-service.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: smm-postgres
          property: connectionString
      - key: PROVIDER_KEY_SECRET
        fromService:
          type: web
          name: smm-api
          envVarKey: PROVIDER_KEY_SECRET

# ---------------------------------------------------------------
# Databases
# ---------------------------------------------------------------
databases:
  - name: smm-postgres
    plan: free
    databaseName: smm_db
    user: smm_user

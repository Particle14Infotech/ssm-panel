version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smm_postgres
    environment:
      POSTGRES_USER: smm_user
      POSTGRES_PASSWORD: smm_password
      POSTGRES_DB: smm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smm_user -d smm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smm_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: smm_mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  otel-collector:
    image: otel/opentelemetry-collector:0.96.0
    container_name: smm_otel
    ports:
      - "4318:4318" # OTLP HTTP receiver

volumes:
  postgres_data:
  redis_data:

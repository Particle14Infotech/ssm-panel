# ==============================================================================
# Nginx Configuration Snippet for YouPI-PG Gateway Pilot
# ==============================================================================
# SECURITY BOUNDARY:
# - ONLY /checkout/ and static public JS assets (youpi.js) are exposed to the internet.
# - /api/v1/payments, /api/v1/admin, /api/v1/observers, control center, and merchant
#   admin ports (6100, 7001, 6001) are STRICTLY BOUND TO LOCALHOST (127.0.0.1).
# - Rate limiting is enforced at the edge.
# ==============================================================================

# Rate limit zone: 10 requests per second per IP with burst of 20
limit_req_zone $binary_remote_addr zone=youpi_checkout_limit:10m rate=10r/s;

# Upstream for the isolated YouPI Checkout Portal running on localhost:7000
upstream youpi_checkout_upstream {
    server 127.0.0.1:7000;
    keepalive 16;
}

# Add this inside the HTTPS server block for smm-panel (e.g. pay.smm-panel.example.com or path-routed)
server {
    listen 443 ssl http2;
    server_name pay.smm-panel.example.com;

    # TLS Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/pay.smm-panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.smm-panel.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "" always; # Controlled via Content-Security-Policy frame-ancestors
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Public checkout portal endpoint (loads /checkout/:paymentId)
    location /checkout/ {
        limit_req zone=youpi_checkout_limit burst=20 nodelay;
        
        proxy_pass http://youpi_checkout_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Connect & Read Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Public distributable merchant SDK script
    location /js/youpi.js {
        limit_req zone=youpi_checkout_limit burst=30 nodelay;
        proxy_pass http://youpi_checkout_upstream/js/youpi.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1h;
    }

    # Static CSS and assets for the checkout portal
    location /css/ {
        proxy_pass http://youpi_checkout_upstream;
        proxy_http_version 1.1;
        proxy_cache_valid 200 1h;
    }

    # SSE Events for real-time checkout updates
    location ~* ^/api/v1/checkout/([^/]+)/(events|stream)$ {
        limit_req zone=youpi_checkout_limit burst=10 nodelay;
        proxy_pass http://youpi_checkout_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    # State & UTR submission for the active checkout session
    location ~* ^/api/v1/checkout/([^/]+)/(state|manual-utr|cancel)$ {
        limit_req zone=youpi_checkout_limit burst=10 nodelay;
        proxy_pass http://youpi_checkout_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BLOCK ALL OTHER ACCESS TO PAYMENT CORE, ADMIN, AND OBSERVERS
    location / {
        return 404 "Not Found";
    }
}


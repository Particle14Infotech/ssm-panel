name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security-audit:
    name: Security & Secret Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Dependency Audit (pnpm audit)
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Snyk Security Test
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --all-projects --severity-threshold=high

  test-and-build:
    name: Lint, Typecheck, Test & E2E
    runs-on: ubuntu-latest
    needs: [security-audit]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smm_user
          POSTGRES_PASSWORD: smm_password
          POSTGRES_DB: smm_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --continue

      - name: Typecheck & Build
        run: pnpm turbo run build

      - name: Unit Tests
        run: pnpm turbo run test --continue

      - name: Run Integrity Suite
        run: npx tsx tests/load/run-integrity.ts

      - name: Run Failure Drills
        run: npx tsx tests/stress/run-drills.ts

      - name: Run DAST Security Suite
        run: npx tsx tests/security/run-security.ts
